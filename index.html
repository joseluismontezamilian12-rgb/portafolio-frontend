<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Luis Monteza | Systems Architect</title>
    <style>
        /* CONFIGURACIÓN Y TIPOGRAFÍA BASE (Estilo Google) */
        :root {
            --bg-color: #030303;
            --zinc-100: #fafafa;
            --zinc-300: #d4d4d8;
            --zinc-400: #a1a1aa;
            --zinc-500: #71717a;
            --zinc-600: #52525b;
            --zinc-700: #3f3f46;
            --zinc-800: #27272a;
            --zinc-900: #18181b;
            --indigo-400: #818cf8;
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --emerald-400: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--zinc-100);
            overflow-x: hidden;
            letter-spacing: -0.02em;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 300;
        }

        /* EFECTOS DE FONDO CROMÁTICOS (Holográficos) */
        .blur-light-wrapper {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        .blur-light {
            position: absolute;
            border-radius: 9999px;
            filter: blur(120px);
            opacity: 0.1;
        }

        /* REJILLA TÉCNICA */
        .grid-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px), linear-gradient(to bottom, #1a1a1a 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
        }

        /* COMPONENTES DE DISEÑO (Glassmorphism Avanzado) */
        .glass-box {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 32px;
            transition: border-color 0.4s ease;
        }

            .glass-box:hover {
                border-color: rgba(255, 255, 255, 0.1);
            }

        /* ESTRUCTURA PRINCIPAL */
        nav {
            position: relative;
            z-index: 50;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            position: relative;
            z-index: 10;
            max-w: 1280px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .bento-grid-header {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            align-items: flex-start;
        }

        @media (min-width: 1024px) {
            main {
                padding: 80px 48px;
            }

            .bento-grid-header {
                grid-template-columns: repeat(12, 1fr);
            }

            .hero-left {
                grid-column: span 5;
            }

            .engine-right {
                grid-column: span 7;
            }
        }

        /* DETALLES VISUALES Y BOTÓN */
        .hero-left header {
            margin-bottom: 32px;
        }

        .engine-display {
            background-color: black;
            border-radius: 22px;
            aspect-ratio: 16 / 10;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .run-btn {
            position: relative;
            z-index: 10;
            background-color: var(--zinc-100);
            color: black;
            border: none;
            padding: 12px 32px;
            border-radius: 9999px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 11px;
            transition: all 0.5s ease;
        }

            .run-btn:hover {
                background-color: var(--cyan-400);
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
            }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(6, 182, 212, 0.08);
            position: absolute;
            left: 0;
            top: 0;
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% {
                top: -100%;
            }

            100% {
                top: 100%;
            }
        }

        /* Estilos menores de texto */
        h1 {
            font-size: 48px;
            font-weight: 200;
            letter-spacing: -0.04em;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 72px;
            }
        }

        .gradient-text {
            background: linear-gradient(90deg, #fff, var(--zinc-500));
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 600;
        }

        .hero-left p {
            color: var(--zinc-400);
            font-weight: 300;
            font-size: 15px;
            max-w: 448px;
            margin-bottom: 24px;
        }

        .meta-data {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .meta-card {
            padding: 16px;
            border-radius: 12px;
        }

            .meta-card strong {
                color: #fff;
                font-size: 12px;
                font-weight: 500;
                text-transform: none;
                letter-spacing: normal;
            }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
</head>
